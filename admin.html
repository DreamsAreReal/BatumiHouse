<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Заявки | Batumi Home</title>
<style>:root{font-family:system-ui,-apple-system,sans-serif;color:#162c45;background:#f5f8fc}*{box-sizing:border-box}body{margin:0}header{background:#12375a;color:white;padding:20px}header div,main{max-width:1120px;margin:auto}main{padding:22px 16px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}h1{font-size:26px;margin:0 0 5px}p{line-height:1.5}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.stat{background:white;border:1px solid #e1e8f0;padding:14px;border-radius:14px;flex:1;min-width:100px}.stat strong{display:block;font-size:24px}.controls{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap}select,button{border:1px solid #cbd7e3;border-radius:9px;padding:10px;background:white;font-size:14px}button{cursor:pointer;background:#1466a3;color:white}button:disabled{opacity:.5}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px}.card{background:white;border:1px solid #e0e6ef;border-radius:15px;padding:17px;overflow-wrap:anywhere}.row{display:flex;justify-content:space-between;gap:12px;margin:9px 0}.muted{color:#64768b;font-size:13px}.card h2{font-size:18px;margin:5px 0}.card select{width:100%}.empty{background:#fff;padding:24px;border-radius:12px}.status{font-size:14px;color:#33445a}.source{background:#e9f3fb;border-radius:12px;padding:3px 9px;font-size:12px}a{color:#185b94}details{margin-top:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-family:inherit}.warning{color:#a33131}</style>
</head><body><header><div><h1>Batumi Home · Заявки</h1><small>Закрытая панель. Контакты доступны только после авторизации Cloudflare Access.</small></div></header><main>
<div class="top"><p class="muted">Последние 50 обращений. Все изменения статусов сохраняются в D1.</p><button id="reload" type="button">Обновить</button></div>
<div class="stats" id="stats"></div>
<div class="controls"><label>Статус <select id="filter"><option value="all">Все</option><option value="new">Новая</option><option value="working">В работе</option><option value="closed">Сделка закрыта</option><option value="lost">Не состоялась</option></select></label></div>
<p id="message" role="status" class="status">Загружаю заявки…</p><div id="cards" class="cards"></div>
</main><script>
const labels={new:'Новая',working:'В работе',closed:'Сделка закрыта',lost:'Не состоялась'};
const cards=document.getElementById('cards'),message=document.getElementById('message'),stats=document.getElementById('stats');
function el(tag,text,cls){const node=document.createElement(tag);if(text!==undefined)node.textContent=String(text??'');if(cls)node.className=cls;return node}
function row(label,value){const e=el('div',undefined,'row');e.append(el('span',label,'muted'),el('span',value||'—'));return e}
async function load(){message.textContent='Загружаю…';cards.replaceChildren();stats.replaceChildren();
try{const response=await fetch('/api/admin/leads?status='+encodeURIComponent(document.getElementById('filter').value),{credentials:'same-origin',cache:'no-store'});
if(!response.ok)throw new Error(response.status===403?'Доступ закрыт. Администратор должен настроить Cloudflare Access.':'Ошибка загрузки: '+response.status);
const data=await response.json();const totals=Object.fromEntries(data.statuses.map(x=>[x.status,x.count]));for(const [status,label] of Object.entries(labels)){const n=el('div',undefined,'stat');n.append(el('span',label,'muted'),el('strong',totals[status]||0));stats.append(n)}
if(!data.leads.length){message.textContent='По выбранному фильтру заявок нет.';return}message.textContent='Показано '+data.leads.length+' последних обращений.';
for(const lead of data.leads){const card=el('article',undefined,'card');const head=el('div',undefined,'row');head.append(el('strong',lead.property||'Подбор'),el('span',lead.source||'other','source'));card.append(head,el('p',new Date(lead.received_at).toLocaleString('ru-RU',{timeZone:'Asia/Tbilisi'}),'muted'),row('Аренда',lead.rental),row('Заезд',lead.checkin),row('Выезд',lead.checkout),row('Гостей',lead.guests),row('Контакт',lead.contact_type+' · '+lead.contact));
if(lead.budget)card.append(row('Бюджет',lead.budget));if(lead.duration)card.append(row('Срок',lead.duration));if(lead.wishes){const d=el('details');d.append(el('summary','Пожелания'),el('pre',lead.wishes));card.append(d)}
const select=el('select');select.setAttribute('aria-label','Статус заявки');for(const [value,label] of Object.entries(labels)){const option=el('option',label);option.value=value;option.selected=value===lead.status;select.append(option)}
select.addEventListener('change',async()=>{select.disabled=true;const old=lead.status;try{const response=await fetch('/api/admin/leads/status',{method:'PATCH',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:lead.id,status:select.value})});if(!response.ok)throw new Error('Не удалось сохранить статус');await load()}catch(error){select.value=old;message.textContent=error.message}finally{select.disabled=false}});card.append(el('p','Статус','muted'),select);cards.append(card)}
}catch(error){message.textContent=error.message;message.className='warning'}}
document.getElementById('filter').addEventListener('change',load);document.getElementById('reload').addEventListener('click',load);load();
</script></body></html>
