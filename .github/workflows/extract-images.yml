name: Extract BatumiHouse images
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract existing photo archive
        run: |
          set -euo pipefail
          test -f BatumiHouse_images_for_GitHub.zip
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          archive = Path("BatumiHouse_images_for_GitHub.zip")
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  path = Path(info.filename)
                  if info.is_dir():
                      continue
                  if not path.parts or path.parts[0] != "images" or ".." in path.parts:
                      raise ValueError(f"Unexpected archive entry: {info.filename}")
                  target = Path.cwd() / path
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(info))
          PY
      - name: Commit extracted images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/
          if ! git diff --cached --quiet; then
            git commit -m "Add apartment photos from existing archive"
            git push
          fi
